# --- keybinds ---

# --- main keybinds ---

$mainMod = SUPER # Sets "Windows" key as main modifier
bind = SUPER, space, exec, bash -lc "__HOME__/.local/bin/rofi-launch"
bind = SUPER_SHIFT, RETURN, exec, env XDG_STATE_HOME=$HOME/.local/state XDG_CACHE_HOME=$HOME/.cache ghostty -e fish
bind = $mainMod,Q,killactive,
bind = SUPER, RETURN, exec, ghostty -e bash -l
bind = $mainMod,F,settiled,
bind = $mainMod SHIFT,F,fullscreen,1
bind = $mainMod,V,exec,hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 900 550; dispatch centerwindow"
bind = SUPER, M, exec, ~/.local/bin/apple-music-tui
bind = SUPER_SHIFT, M, exec, hyprctl dispatch togglespecialworkspace applemusic
bind = $mainMod,D, exec,dolphin
bind = , F8, exec, pkill -SIGUSR1 -f gpu-screen-recorder
bind = $mainMod,K, exec,kate
bind = $mainMod, P, exec, nwg-bar
bind = $mainMod, L, exec, ~/.config/hypr/scripts/hyprlock-current-wall.sh
#--- move focus ---

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- move windows ---

bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Pixel nudges for floating windows.
binde = $mainMod ALT, left, moveactive, -40 0
binde = $mainMod ALT, right, moveactive, 40 0
binde = $mainMod ALT, up, moveactive, 0 -40
binde = $mainMod ALT, down, moveactive, 0 40

# ---resize windows ---
binde = $mainMod SHIFT, left, resizeactive,-50 0
binde = $mainMod SHIFT, right, resizeactive,50 0
binde = $mainMod SHIFT, up, resizeactive,0 -50
binde = $mainMod SHIFT, down, resizeactive,0 50
binde = $mainMod ALT_SHIFT, left, resizeactive,-30 0
binde = $mainMod ALT_SHIFT, right, resizeactive,30 0
binde = $mainMod ALT_SHIFT, up, resizeactive,0 -30
binde = $mainMod ALT_SHIFT, down, resizeactive,0 30

# --- move active window to a workspace ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- create a new empty workspace ---

bind = $mainMod SHIFT, M, workspace, empty

# --- screenshot ---

# SUPER + SHIFT + S = select area and SAVE TO DISK
bind = $mainMod SHIFT, S, exec, bash -lc 'mkdir -p "$HOME/Pictures/Screenshots"; grim -g "$(slurp)" "$HOME/Pictures/Screenshots/area-$(date +%Y%m%d-%H%M%S).png"'
