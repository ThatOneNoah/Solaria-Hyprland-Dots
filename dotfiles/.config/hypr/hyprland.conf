source=~/.config/hypr/matugen.conf

# --- imports ---

source=~/.config/hypr/keybinds.conf

# --- monitors ---
monitor = ,preferred,auto,1
# Noah's monitor layout:
# monitor = DP-3,2560x1440@165,auto,1
# monitor = HDMI-1,1920x1080@60,auto,1

# --- autostart ---
exec-once = bash -lc 'if command -v swww-daemon >/dev/null 2>&1; then pgrep -x swww-daemon >/dev/null || (setsid swww-daemon >/dev/null 2>&1 < /dev/null & sleep 0.3); elif command -v awww-daemon >/dev/null 2>&1; then pgrep -x awww-daemon >/dev/null || (setsid awww-daemon >/dev/null 2>&1 < /dev/null & sleep 0.3); fi'
#exec-once = pkill hypridle; hypridle -c ~/.config/hypr/hypridle.conf
exec-once = nm-applet --indicator
#exec-once = waybar &
exec-once = sh -c 'pkill -x quickshell 2>/dev/null || true; pkill -x qs 2>/dev/null || true; qs -p "$HOME/.config/quickshell/shell.qml"'
exec-once = sh -c 'pgrep -x mako >/dev/null || mako >/tmp/mako.log 2>&1 &'
exec-once = sh -c 'eww daemon >/tmp/eww.log 2>&1 || true; sleep 0.4; eww open desktop_time >/tmp/eww-open.log 2>&1 || true'
# nwg-dock-hyprland is kept installed, but Quickshell now owns the app dock.
# exec-once = sleep 3 && nwg-dock-hyprland -x -p bottom -i 24 -ml 10 -mr 10 -mb 5 -mt 5
bind = ALT_SHIFT, H, exec, ~/.local/bin/reload-dock-hypr.sh
# Optional replay buffer:
# exec-once = mkdir -p "$HOME/Videos/Game Clips" && pgrep -x gpu-screen-recorder >/dev/null || gpu-screen-recorder -w screen -f 60 -r 30 -c mp4 -o "$HOME/Videos/Game Clips"
layerrule = match:namespace rofi, blur on
layerrule = match:namespace rofi, ignore_alpha 0.08
layerrule = match:namespace mako, blur on
layerrule = match:namespace mako, ignore_alpha 0.10
layerrule = match:namespace notifications, blur on
layerrule = match:namespace notifications, ignore_alpha 0.10

# --- environment variables ---

env = GDK_BACKEND=wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER=wayland
env = CLUTTER_BACKEND=wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION=1
env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32
env = QT_QPA_PLATFORMTHEME=qt6ct

# --- look & feel ---
general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  col.active_border = rgba(88c0d0ff)
  col.inactive_border = rgba(313244ff)
  resize_on_border = false
  allow_tearing = false
  layout = master
}

#--- input ---

input {
    kb_file =
    accel_profile = flat
    sensitivity = 0.5
}

decoration {
  rounding = 14

  shadow {
    enabled = yes
    range = 20
    render_power = 3
    color = rgba(00000099)
  }

  blur {
    enabled = yes
    size = 15
    contrast = 1.5
    brightness = 0.8
    vibrancy = 0.10

    popups = true
    xray = false
    new_optimizations = true
  }
}


animations {
  enabled = yes
  bezier = riceOut, 0.16, 1, 0.3, 1
  bezier = riceIn, 0.7, 0, 0.84, 0
  bezier = riceSnap, 0.34, 1.56, 0.64, 1
  bezier = riceFlow, 0.22, 1, 0.36, 1

  animation = windowsIn, 1, 7, riceSnap, popin 82%
  animation = windowsOut, 1, 6, riceIn, popin 78%
  animation = windowsMove, 1, 7, riceFlow
  animation = border, 1, 9, riceOut
  animation = borderangle, 1, 10, riceFlow
  animation = fadeIn, 1, 6, riceOut
  animation = fadeOut, 1, 5, riceIn
  animation = fadeSwitch, 1, 5, riceOut
  animation = layers, 1, 7, riceSnap, slide
  animation = layersOut, 1, 6, riceIn, slide
  animation = workspaces, 1, 7, riceFlow, slidevert
}

misc {
  animate_manual_resizes = true
  animate_mouse_windowdragging = true
}

#---rofi windowrulevs---

windowrule = match:class ^(rofi-wall-preview)$, float on
windowrule = match:class ^(rofi-wall-preview)$, pin on
windowrule = match:class ^(rofi-wall-preview)$, no_initial_focus on
windowrule = workspace special:applemusic silent, match:class ^chrome-blgdilankhbcpipclgpdndahbehalgkh-Profile_1$
windowrule = no_initial_focus on, match:class ^chrome-blgdilankhbcpipclgpdndahbehalgkh-Profile_1$

#---volume slider---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


#---wal16-colors---

source = __HOME__/.config/hypr/wal-colors.conf
